# Render blueprint — Relay staging
# Set SECRET_KEY, ADMIN_PASSWORD, and public URLs after create.

services:
  - type: web
    name: relay-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: relay-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: relay-redis
          type: redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@relay.local
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: APP_URL
        sync: false
      - key: API_URL
        sync: false
      - key: EXPORT_DIR
        value: /data/exports
    dockerCommand: sh -c "alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT"

  - type: worker
    name: relay-worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: relay-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: relay-redis
          type: redis
          property: connectionString
      - key: SECRET_KEY
        fromService:
          name: relay-api
          type: web
          envVarKey: SECRET_KEY
      - key: EXPORT_DIR
        value: /data/exports
      - key: WORKER_ID
        value: render-worker-1
    dockerCommand: python -m app.worker.main

  - type: web
    name: relay-web
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: starter
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false

  - type: redis
    name: relay-redis
    plan: starter
    maxmemoryPolicy: noeviction

databases:
  - name: relay-db
    plan: basic-256mb
